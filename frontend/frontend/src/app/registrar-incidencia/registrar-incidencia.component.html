<div class="container">
  <div class="header-controls">
    <button type="button" (click)="volver()" class="btn btn-secondary">⬅️ Volver</button>
  </div>

  <h2>Registrar Incidencia</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <label for="fechaIncidencia">Fecha de Incidencia</label>
    <input id="fechaIncidencia" type="date" formControlName="fechaIncidencia">

    <label for="tipoIncidencia">Tipo de Incidencia</label>
    <select id="tipoIncidencia" formControlName="tipoIncidencia">
      <option value="" disabled>Seleccione un tipo</option>
      <option value="robada">Robada</option>
      <option value="perdida">Perdida</option>
      <option value="mal funcionamiento">Mal funcionamiento</option>
    </select>

    <label for="estadoIncidencia">Estado de la Incidencia</label>
    <select id="estadoIncidencia" formControlName="estadoIncidencia">
      <option value="" disabled>Seleccione un estado</option>
      <option value="abierta">Abierta</option>
      <option value="en proceso">En proceso</option>
      <option value="cerrada">Cerrada</option>
    </select>

    <label for="cedulaCliente">Cédula del Cliente</label>
    <input id="cedulaCliente" type="text" formControlName="cedulaCliente">

    <label for="codigoTarjeta">Código de Tarjeta (Opcional)</label>
    <input id="codigoTarjeta" type="text" formControlName="codigoTarjeta">

    <label for="comentarios">Comentarios</label>
    <textarea id="comentarios" formControlName="comentarios" rows="4"></textarea>

    <button type="submit" [disabled]="form.invalid">Registrar</button>
  </form>
</div>
