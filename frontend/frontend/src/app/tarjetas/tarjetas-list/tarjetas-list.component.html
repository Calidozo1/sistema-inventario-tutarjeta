<div class="container">
  <h2>📦 Gestión de Tarjetas</h2>

  <div class="controls">
    <mat-form-field appearance="fill" class="filter-field">
      <mat-label>🔍 Buscar Tarjeta</mat-label>
      <input matInput (keyup)="filtrar($event)" placeholder="Código, tipo o estado...">
    </mat-form-field>

    <div class="actions">
      <a routerLink="/tarjetas/nueva" class="btn btn-success">➕ Registrar nueva tarjeta</a>
      <button (click)="cancelar()" class="btn btn-secondary">⬅️ Volver</button>
    </div>

  </div>

  <div class="mat-elevation-z8 table-container">
    <table mat-table [dataSource]="dataSource" class="tarjetas-table">

      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let tarjeta">{{tarjeta.id}}</td>
      </ng-container>

      <ng-container matColumnDef="codigoUnico">
        <th mat-header-cell *matHeaderCellDef>Código Único</th>
        <td mat-cell *matCellDef="let tarjeta"><strong>{{tarjeta.codigoUnico}}</strong></td>
      </ng-container>

      <ng-container matColumnDef="tipoTarjeta">
        <th mat-header-cell *matHeaderCellDef>Tipo</th>
        <td mat-cell *matCellDef="let tarjeta">
          <ng-container *ngIf="editandoId !== tarjeta.id">{{tarjeta.tipoTarjeta}}</ng-container>
          <div *ngIf="editandoId === tarjeta.id" [formGroup]="edicionForm">
            <input formControlName="tipoTarjeta" class="edit-input">
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let tarjeta">
          <ng-container *ngIf="editandoId !== tarjeta.id">
            <span [ngClass]="'badge estado-' + tarjeta.estado.toLowerCase()">
              {{tarjeta.estado}}
            </span>
          </ng-container>
          <div *ngIf="editandoId === tarjeta.id" [formGroup]="edicionForm">
            <select formControlName="estado" class="edit-input">
              <option value="Disponible">Disponible</option>
              <option value="Asignada">Asignada</option>
              <option value="Vendida">Vendida</option>
              <option value="Dañada">Dañada</option>
            </select>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let tarjeta">
          <ng-container *ngIf="esAdmin">
            <ng-container *ngIf="editandoId !== tarjeta.id">
              <button (click)="iniciarEdicion(tarjeta)" class="btn-edit">✏️</button>
              <button (click)="eliminarTarjeta(tarjeta.id)" class="btn-delete">🗑️</button>
            </ng-container>
            <ng-container *ngIf="editandoId === tarjeta.id">
              <button (click)="guardarEdicion(tarjeta.id)" class="btn-save">💾</button>
              <button (click)="cancelarEdicion()" class="btn-cancel">❌</button>
            </ng-container>
          </ng-container>
          <span *ngIf="!esAdmin" class="text-muted">Solo lectura</span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
